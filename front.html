<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KLE Technological University — Student Clubs Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d;--maroon:#8a1c2b;--sun:#f4b73f;--paper:#f3f4f7;
  --text-muted:#566074;
  --head:'Archivo','Arial Black',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ambient-glow{display:none}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:3px solid var(--ink);padding:12px 48px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px}
.brand span{font-family:var(--head)}
.brand-badge{background:var(--maroon);color:#fff;padding:6px 12px;border-radius:6px;font-size:14px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}
.nav-links{display:flex;align-items:center;gap:28px;font-size:15px;font-weight:600}
.nav-links a{padding:4px 0;border-bottom:3px solid transparent;transition:border-color .15s}
.nav-links a:hover{border-color:var(--sun)}
.nav-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn-nav{padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;border:2px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn-nav:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-head{background:#fff}
.btn-student{background:var(--sun)}

/* HERO */
.hero{position:relative;background:var(--maroon);color:#fff;padding:72px 24px 0;border-bottom:3px solid var(--ink);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 0 50%;background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2px);background-size:20px 20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.hero-inner{position:relative;max-width:1180px;margin:0 auto}
.uni-pill{display:inline-block;background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:6px 14px;border-radius:6px;font-size:13.5px;font-weight:700;margin-bottom:22px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--ink)}
.hero h1{font-family:var(--head);font-weight:900;font-size:clamp(36px,6vw,66px);line-height:1.03;letter-spacing:-1.5px;max-width:800px;margin-bottom:22px}
.hero p{font-size:18px;line-height:1.7;color:#f3dde0;max-width:620px;margin-bottom:34px}
