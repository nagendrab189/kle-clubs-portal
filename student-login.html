<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>Sign in with Google · KLE Tech Clubs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #fbf9f6; color: #0f172a; padding: 40px 20px; }
    .card { max-width: 440px; margin: 60px auto; background: #fff; padding: 36px 32px; border-radius: 20px; border: 1px solid #ece7e0; box-shadow: 0 16px 40px rgba(0,0,0,0.06); text-align: center; }
    .pill { display: inline-block; background: #fef2f2; color: #c8102e; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 50px; margin-bottom: 14px; }
    h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.sub { color: #475569; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .field { text-align: left; margin-bottom: 18px; }
    .field label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #ece7e0; border-radius: 10px; font-size: 14px; outline: none; }
    .field input:focus { border-color: #d4a024; }
    .google-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #111827;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s, background 0.2s;
    }
    .google-btn:hover { background: #1e293b; transform: translateY(-1px); }
    .msg { font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; padding: 12px; border-radius: 10px; text-align: left; }
    .msg.err { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .msg.ok { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .back-link { display: inline-block; margin-top: 20px; font-size: 13px; color: #c8102e; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">
    <span class="pill">KLE Tech Students Only</span>
    <h2>Sign in with Google</h2>
    <p class="sub">
      Click below to sign in with your official <b>@kletech.ac.in</b> Google account.
    </p>

    <div id="statusMsg" class="msg"></div>

    <div class="field">
      <label>Your University USN</label>
      <input type="text" id="usnInput" placeholder="e.g. 01FE24BCS045" />
    </div>

    <!-- Direct Clickable Button that always opens the Google Popup -->
    <button class="google-btn" onclick="openGooglePopup()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/>
      </svg>
      Continue with Google (@kletech.ac.in)
    </button>

    <a href="front.html" class="back-link">← Back to Clubs Website</a>
  </div>

  <script>
    const CLIENT_ID = "569900198066-2ff35ase3p649sqckmnmhbd7grd7pq9e.apps.googleusercontent.com";
    const statusMsg = document.getElementById("statusMsg");
    let tokenClient;

    function showMessage(text, isError) {
      statusMsg.textContent = text;
      statusMsg.className = isError ? "msg err" : "msg ok";
    }

    // Warn immediately if opened via 127.0.0.1:5500 instead of localhost:3000
    if (window.location.hostname === "127.0.0.1") {
      showMessage(
        "You opened this on 127.0.0.1! Please open http://localhost:3000/student-login.html in your browser so Google allows login.",
        true
      );
    }

    function openGooglePopup() {
      if (!window.google || !window.google.accounts) {
        showMessage("Google script is still loading. Check your internet connection and try again.", true);
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "openid email profile",
        hosted_domain: "kletech.ac.in",
        prompt: "select_account",
        callback: async (tokenResponse) => {
          if (tokenResponse.error) {
            showMessage("Google Login Error: " + tokenResponse.error, true);
            return;
          }

          const usn = document.getElementById("usnInput").value.trim();

          try {
            const res = await fetch("/api/google-login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                access_token: tokenResponse.access_token,
                usn: usn
              })
            });

            const data = await res.json();
            if (!res.ok) {
              showMessage(data.error, true);
              return;
            }

            localStorage.setItem("kle_student", JSON.stringify(data.student));
            showMessage("Verified as " + data.student.email + "! Redirecting...", false);

            setTimeout(() => {
              window.location.href = "front.html#clubs";
            }, 800);
          } catch (err) {
            showMessage("Cannot connect to server.js! Run 'node server.js' in your VS Code terminal.", true);
          }
        }
      });

      tokenClient.requestAccessToken();
    }
  </script>
</body>
</html>
